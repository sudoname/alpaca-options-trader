name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY: test-only
      ALPACA_SECRET_KEY: test-only
      ALPACA_PAPER: 'true'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt 'pytest==8.4.2'
      - name: Run all tests (network disabled in conftest.py)
        run: python -m pytest -q --tb=short
